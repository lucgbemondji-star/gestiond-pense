<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budgets | Gestionnaire de dépenses</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="dashboard.html"><span class="brand-mark" aria-hidden="true">G</span><span>Gestionnaire <span style="font-weight:500;color:#77847f;">de dépenses</span></span></a>
        <nav class="navbar">
          <a href="dashboard.html">Tableau de bord</a>
          <a href="depenses.html">Dépenses</a>
          <a href="recurrentes.html">Récurrences</a>
          <a href="comptes.html">Comptes</a>
          <a href="categories.html">Catégories</a>
          <a href="budgets.html">Budgets</a>
          <a href="import.html">Import</a>
          <a href="rapports.html">Rapports</a>
          <a href="#" id="logout-link">Déconnexion</a>
        </nav>
      </header>

      <main class="page">
        <div id="message" class="alert success" hidden></div>
        <h1>Budgets</h1>
        <section class="card">
          <h2 id="budget-form-title">Créer un budget</h2>
          <form id="budget-form" class="form-row">
            <input type="hidden" name="id" />
            <div class="grid grid-2">
              <div>
                <label for="budgetCategorie">Catégorie</label>
                <select id="budgetCategorie" name="categorieId" required>
                </select>
              </div>
              <div>
                <label for="budgetPeriode">Période</label>
                <select id="budgetPeriode" name="periode">
                  <option value="MENSUEL">Mensuel</option>
                  <option value="HEBDO">Hebdomadaire</option>
                </select>
              </div>
              <div>
                <label for="budgetPlafond">Plafond (XOF)</label>
                <input id="budgetPlafond" name="plafondXof" type="number" step="1" min="1" required />
              </div>
              <div>
                <label for="budgetDateDebut">Date de début</label>
                <input id="budgetDateDebut" name="dateDebut" type="date" required />
              </div>
            </div>
            <button type="submit" class="primary">Enregistrer</button>
            <button type="button" id="annuler-budget" class="secondary" hidden>Annuler</button>
          </form>
        </section>

        <section class="card" style="margin-top: 1.5rem;">
          <h2>État des budgets</h2>
          <div id="budgets-list" class="form-row"></div>
        </section>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/budgets.js"></script>
  </body>
</html>
