<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rapports | Gestionnaire de dépenses</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="dashboard.html"><span class="brand-mark" aria-hidden="true">G</span><span>Gestionnaire <span style="font-weight:500;color:#77847f;">de dépenses</span></span></a>
        <nav class="navbar">
          <a href="dashboard.html">Tableau de bord</a>
          <a href="depenses.html">Dépenses</a>
          <a href="recurrentes.html">Récurrences</a>
          <a href="comptes.html">Comptes</a>
          <a href="categories.html">Catégories</a>
          <a href="budgets.html">Budgets</a>
          <a href="import.html">Import</a>
          <a href="rapports.html">Rapports</a>
          <a href="#" id="logout-link">Déconnexion</a>
        </nav>
      </header>

      <main class="page">
        <div id="message" class="alert success" hidden></div>
        <h1>Rapports</h1>
        <section class="card">
          <h2>Rapport mensuel</h2>
          <form id="rapport-form" class="form-row">
            <label for="rapportMois">Mois</label>
            <input id="rapportMois" type="month" required />
            <button id="generate-report" class="primary" type="submit">Générer</button>
            <button id="download-csv" class="secondary" type="button">Exporter CSV</button>
            <button id="download-pdf" class="secondary" type="button">Imprimer / enregistrer en PDF</button>
          </form>
          <div id="rapport-result" class="report-box"></div>
        </section>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/rapports.js"></script>
  </body>
</html>
